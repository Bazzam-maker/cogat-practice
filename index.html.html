  <script>
    (function() {
      'use strict';
      TD = JSON.parse(document.getElementById('qdata').textContent);

var TD = null;

function shuffle(arr) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}

function mkItems(ti, bi, si) {
  return shuffle(TD[ti].batteries[bi].subtests[si].items.map(function(item) {
    var orig = item.choices.slice();
    var correct = orig['ABCDE'.indexOf(item.answer)];
    var nc = shuffle(orig.slice());
    return { q: item.q, choices: nc, answer: 'ABCDE'[nc.indexOf(correct)], why: item.why };
  }));
}

function pct(r, t) { return t ? Math.round(r / t * 100) : 0; }

var STORAGE_KEY = 'cogat_v3';
var P = {};
function loadP() { try { P = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}'); } catch(e) { P = {}; } }
function saveP() { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(P)); } catch(e) {} }
function pk(ti, bn, sn) { return ti + '|' + bn + '|' + sn; }
function gP(ti, bn, sn) { return P[pk(ti, bn, sn)] || { a: {}, best: null, tries: 0 }; }
function sP(ti, bn, sn, v) { P[pk(ti, bn, sn)] = v; saveP(); }

var BAT = {
  Verbal:       { bg: '#dbeafe', fg: '#1e40af', sh: 'VER' },
  Quantitative: { bg: '#dcfce7', fg: '#166534', sh: 'QTY' },
  Nonverbal:    { bg: '#fef9c3', fg: '#92400e', sh: 'NON' }
};

var state = { screen: 'home', tab: 'tests', test: 0, bat: 0, sub: 0, quiz: null, showRev: false };

function go(screen) {
  state.screen = screen;
  state.showRev = false;
  window.scrollTo(0, 0);
  render();
}

var root = document.getElementById('app');

function h(tag, attrs, children) {
  var el = document.createElement(tag);
  if (attrs) {
    Object.keys(attrs).forEach(function(k) {
      if (k === 'style') {
        Object.assign(el.style, attrs[k]);
      } else if (k === 'onclick') {
        el.addEventListener('click', attrs[k]);
      } else if (k === 'disabled') {
        if (attrs[k]) el.disabled = true;
      } else {
        el[k] = attrs[k];
      }
    });
  }
  if (children !== undefined && children !== null) {
    if (Array.isArray(children)) {
      children.forEach(function(c) {
        if (c === null || c === undefined) return;
        if (typeof c === 'string' || typeof c === 'number') {
          el.appendChild(document.createTextNode(String(c)));
        } else {
          el.appendChild(c);
        }
      });
    } else if (typeof children === 'string' || typeof children === 'number') {
      el.textContent = String(children);
    } else if (children.nodeType) {
      el.appendChild(children);
    }
  }
  return el;
}

function div(style, children) { return h('div', { style: style }, children); }
function p(style, text) { return h('p', { style: style }, text); }
function span(style, text) { return h('span', { style: style }, text); }
function btn(style, text, fn) {
  var b = h('button', { style: style, onclick: fn }, text);
  return b;
}

var CARD = 'background:#fff;border-radius:14px;box-shadow:0 1px 4px rgba(0,0,0,.1);border:none;font-family:inherit;cursor:pointer;width:100%;text-align:left;';
var BK_S = 'width:38px;height:38px;background:#fff;border:none;border-radius:10px;font-size:20px;color:#555;box-shadow:0 1px 3px rgba(0,0,0,.12);display:flex;align-items:center;justify-content:center;flex-shrink:0;cursor:pointer;font-family:inherit;';

function backBtn(fn) { return btn(BK_S, '\u2190', fn); }

function screenHdr(onBack, title, sub) {
  return div('display:flex;align-items:center;gap:12px;margin-bottom:16px;', [
    backBtn(onBack),
    div('', [
      h('div', { style: { fontSize: '18px', fontWeight: '700', color: '#1a1a1a' } }, title),
      sub ? h('div', { style: { fontSize: '13px', color: '#888', marginTop: '1px' } }, sub) : null
    ])
  ]);
}

function resetBtn(label, danger, fn) {
  return btn(
    'display:block;width:100%;padding:13px;border-radius:14px;background:' + (danger ? '#fff5f5' : '#eef2ff') +
    ';border:2px solid ' + (danger ? '#fca5a5' : '#c7d2fe') + ';color:' + (danger ? '#b91c1c' : '#3730a3') +
    ';font-size:14px;font-weight:700;font-family:inherit;text-align:center;margin:4px 0 8px;cursor:pointer;',
    label, fn
  );
}

function statCard(val, lbl, color) {
  return div('background:#fff;border-radius:12px;padding:14px;text-align:center;box-shadow:0 1px 4px rgba(0,0,0,.08);', [
    h('div', { style: { fontSize: '24px', fontWeight: '800', color: color || '#1a1a1a' } }, String(val)),
    h('div', { style: { fontSize: '11px', color: '#888', marginTop: '3px', fontWeight: '600', textTransform: 'uppercase', letterSpacing: '0.4px' } }, lbl)
  ]);
}

function pill(text, type) {
  var styles = { new: '#f0f4f8:#888', part: '#fff7ed:#b45309', done: '#dcfce7:#166534' };
  var parts = (styles[type] || styles.new).split(':');
  return span('font-size:11px;font-weight:700;padding:4px 10px;border-radius:20px;background:' + parts[0] + ';color:' + parts[1] + ';', text);
}

function progBar(val, color, height) {
  color = color || '#1a73e8'; height = height || 4;
  var outer = div('height:' + height + 'px;background:#e8e8e8;border-radius:' + (height/2) + 'px;overflow:hidden;margin:10px 0 4px;', []);
  var inner = div('', []);
  inner.style.cssText = 'height:100%;width:' + val + '%;background:' + color + ';border-radius:' + (height/2) + 'px;transition:width .3s;';
  outer.appendChild(inner);
  return outer;
}

// ── HOME ────────────────────────────────────────────────────────────────────
function renderHome() {
  var container = div('', []);
  container.appendChild(div('text-align:center;padding:28px 0 4px;', [
    h('div', { style: { fontSize: '28px', fontWeight: '700', marginBottom: '4px' } }, '\uD83D\uDCDA CogAT Practice'),
    h('div', { style: { fontSize: '14px', color: '#888', marginBottom: '20px' } }, 'Grade 4 \u00b7 Level 10 \u00b7 192 questions')
  ]));

  var tabBar = div('display:flex;background:#fff;border-radius:12px;padding:4px;margin-bottom:16px;box-shadow:0 1px 3px rgba(0,0,0,.1);gap:4px;', []);
  function tabStyle(active) {
    return 'flex:1;padding:9px 8px;border:none;border-radius:10px;cursor:pointer;font-size:14px;font-weight:600;font-family:inherit;' +
      (active ? 'background:#1a73e8;color:#fff;' : 'background:transparent;color:#888;');
  }
  var tTests = btn(tabStyle(state.tab === 'tests'), 'Practice Tests', function() { state.tab = 'tests'; render(); });
  var tProg  = btn(tabStyle(state.tab === 'progress'), 'My Progress', function() { state.tab = 'progress'; render(); });
  tabBar.appendChild(tTests); tabBar.appendChild(tProg);
  container.appendChild(tabBar);

  if (state.tab === 'tests') {
    var grid = div('display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px;', []);
    TD.forEach(function(test, ti) {
      var tot = 0, done = 0;
      test.batteries.forEach(function(b) {
        b.subtests.forEach(function(s) {
          var pp = gP(ti, b.name, s.name);
          tot += s.items.length;
          done += Object.keys(pp.a).length;
        });
      });
      var card = btn(CARD + 'padding:16px;', '', function() { state.test = ti; go('battery'); });
      card.appendChild(h('div', { style: { fontSize: '15px', fontWeight: '700', marginBottom: '4px', color: '#1a1a1a' } }, test.title));
      card.appendChild(h('div', { style: { fontSize: '12px', color: '#888' } }, tot + ' questions'));
      card.appendChild(progBar(pct(done, tot)));
      card.appendChild(h('div', { style: { fontSize: '11px', color: '#aaa' } }, done + '/' + tot + ' answered'));
      grid.appendChild(card);
    });
    container.appendChild(grid);

  } else {
    var tot2 = 0, done2 = 0, cor2 = 0;
    TD.forEach(function(t, ti) {
      t.batteries.forEach(function(b) {
        b.subtests.forEach(function(s) {
          var pp = gP(ti, b.name, s.name);
          tot2 += s.items.length;
          var vals = Object.values(pp.a);
          done2 += vals.length;
          cor2  += vals.filter(function(v) { return v.k; }).length;
        });
      });
    });
    var sg = div('display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:14px;', [
      statCard(done2, 'Answered'),
      statCard((done2 ? pct(cor2, done2) : 0) + '%', 'Accuracy', '#166534'),
      statCard(tot2 - done2, 'Remaining')
    ]);
    container.appendChild(sg);
    TD.forEach(function(t, ti) {
      container.appendChild(h('div', { style: { fontSize: '13px', fontWeight: '700', color: '#888', textTransform: 'uppercase', letterSpacing: '0.4px', margin: '14px 0 8px' } }, t.title));
      t.batteries.forEach(function(b) {
        b.subtests.forEach(function(s) {
          var pp = gP(ti, b.name, s.name);
          var vals = Object.values(pp.a);
          var d = vals.length, t2 = s.items.length;
          var c = vals.filter(function(v) { return v.k; }).length;
          var bw = d ? pct(c, d) : 0;
          var bc = bw >= 75 ? '#4caf50' : bw >= 50 ? '#f59e0b' : '#f44336';
          var row = div('display:flex;align-items:center;gap:10px;margin-bottom:9px;', [
            h('div', { style: { width: '145px', fontSize: '13px', flexShrink: '0' } }, s.name),
          ]);
          var tr = div('flex:1;height:6px;background:#e8e8e8;border-radius:3px;overflow:hidden;', []);
          var tf = div('', []);
          tf.style.cssText = 'height:100%;width:' + bw + '%;border-radius:3px;background:' + bc + ';';
          tr.appendChild(tf);
          row.appendChild(tr);
          row.appendChild(h('div', { style: { fontSize: '12px', color: '#888', width: '36px', textAlign: 'right', fontWeight: '600' } }, d ? bw + '%' : '--'));
          container.appendChild(row);
        });
      });
    });
    container.appendChild(resetBtn('\uD83D\uDDD1 Reset all & shuffle questions', true, function() {
      if (!confirm('Reset ALL progress across both tests?\nThis cannot be undone.')) return;
      localStorage.removeItem(STORAGE_KEY);
      loadP();
      render();
    }));
  }
  return container;
}

// ── BATTERY ─────────────────────────────────────────────────────────────────
function renderBattery() {
  var test = TD[state.test];
  var c = div('', [screenHdr(function() { go('home'); }, test.title, 'Choose a battery')]);
  var list = div('display:grid;gap:10px;margin-bottom:16px;', []);
  test.batteries.forEach(function(b, bi) {
    var tot = 0, done = 0, cor = 0;
    b.subtests.forEach(function(s) {
      var pp = gP(state.test, b.name, s.name);
      tot += s.items.length;
      var vals = Object.values(pp.a);
      done += vals.length;
      cor  += vals.filter(function(v) { return v.k; }).length;
    });
    var bs = BAT[b.name] || { bg: '#eee', fg: '#333', sh: b.name[0] };
    var row = btn(CARD + 'padding:14px 16px;display:flex;align-items:center;gap:14px;', '', function() { state.bat = bi; go('subtest'); });
    row.appendChild(h('div', { style: { width: '42px', height: '42px', borderRadius: '12px', background: bs.bg, color: bs.fg, display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: '11px', fontWeight: '800', flexShrink: '0' } }, bs.sh));
    var info = div('flex:1;', [
      h('div', { style: { fontSize: '15px', fontWeight: '700', color: '#1a1a1a' } }, b.name + ' Battery'),
      h('div', { style: { fontSize: '12px', color: '#888', marginTop: '2px' } }, b.subtests.length + ' subtests \u00b7 ' + tot + ' questions')
    ]);
    row.appendChild(info);
    row.appendChild(h('div', { style: { fontSize: '13px', color: '#888', flexShrink: '0' } }, done ? pct(cor, done) + '%' : 'New'));
    list.appendChild(row);
  });
  c.appendChild(list);
  c.appendChild(resetBtn('\u21ba Reset & shuffle all questions in this test', false, function() {
    if (!confirm('Reset all progress for this entire test?')) return;
    test.batteries.forEach(function(b) {
      b.subtests.forEach(function(s) { sP(state.test, b.name, s.name, { a: {}, best: null, tries: 0 }); });
    });
    render();
  }));

}

// ── SUBTEST ──────────────────────────────────────────────────────────────────
function renderSubtest() {
  var b = TD[state.test].batteries[state.bat];
  var c = div('', [screenHdr(function() { go('battery'); }, b.name + ' Battery', 'Choose a subtest')]);
  var list = div('display:grid;gap:10px;margin-bottom:16px;', []);
  b.subtests.forEach(function(s, si) {
    var pp = gP(state.test, b.name, s.name);
    var vals = Object.values(pp.a);
    var d = vals.length, t = s.items.length, cv = vals.filter(function(v) { return v.k; }).length;
    var pillTxt, pillType;
    if (!d)       { pillTxt = 'New';           pillType = 'new'; }
    else if (d<t) { pillTxt = d + '/' + t;     pillType = 'part'; }
    else          { pillTxt = pct(cv,t) + '%'; pillType = 'done'; }
    var best = pp.best !== null ? ' \u00b7 Best: ' + pp.best + '%' : '';
    var row = btn(CARD + 'padding:14px 16px;display:flex;align-items:center;justify-content:space-between;', '', function() {
      state.sub = si;
      state.quiz = { items: mkItems(state.test, state.bat, si), cur: 0, answers: {}, streak: 0, revealed: false };

    });

      h('div', { style: { fontSize: '15px', fontWeight: '700', color: '#1a1a1a' } }, s.name),
      h('div', { style: { fontSize: '12px', color: '#888', marginTop: '2px' } }, t + ' questions' + best)
    ]);
    row.appendChild(left);
    var right = div('display:flex;align-items:center;gap:8px;flex-shrink:0;', [
      pill(pillTxt, pillType),
      span('color:#ccc;font-size:20px;line-height:1;', '\u203a')
    ]);
    row.appendChild(right);
    list.appendChild(row);
  });
  c.appendChild(list);
  c.appendChild(resetBtn('\u21ba Reset & shuffle this entire battery', false, function() {
    if (!confirm('Reset all progress for ' + b.name + ' Battery?')) return;

    render();
  }));
  return c;
}

// ── QUIZ ─────────────────────────────────────────────────────────────────────
function renderQuiz() {
  var q = state.quiz;
  var item = q.items[q.cur];
  var tot  = q.items.length;
  var corIdx = 'ABCDE'.indexOf(item.answer);
  var lastAns = q.answers[q.cur];
  var bn = TD[state.test].batteries[state.bat].name;
  var sn = TD[state.test].batteries[state.bat].subtests[state.sub].name;
  var instr = TD[state.test].batteries[state.bat].subtests[state.sub].instructions;

  var c = div('', []);

  var hdr = div('display:flex;align-items:center;gap:12px;margin-bottom:12px;', [
    backBtn(function() { go('subtest'); }),
    div('', [
      h('div', { style: { fontSize: '13px', fontWeight: '700', color: '#1a1a1a' } }, sn),
      h('div', { style: { fontSize: '12px', color: '#888' } }, 'Question ' + (q.cur+1) + ' of ' + tot)
    ])
  ]);
  c.appendChild(hdr);

  var pt = div('height:5px;background:#e0e0e0;border-radius:3px;margin-bottom:16px;overflow:hidden;', []);
  var pf = div('', []);
  pf.style.cssText = 'height:100%;width:' + pct(q.cur, tot) + '%;background:#1a73e8;border-radius:3px;';
  pt.appendChild(pf);
  c.appendChild(pt);

  if (q.streak >= 3) {
    c.appendChild(div('background:#dcfce7;border-radius:12px;padding:10px 14px;margin-bottom:14px;font-size:14px;font-weight:700;color:#166534;',
      '\uD83D\uDD25 ' + q.streak + ' correct in a row!'));
  }

  c.appendChild(div('background:#fff;border-radius:12px;padding:13px 15px;margin-bottom:14px;font-size:13px;color:#555;line-height:1.7;box-shadow:0 1px 3px rgba(0,0,0,.06);', instr));

  var qc = div('background:#fff;border-radius:16px;padding:20px;margin-bottom:14px;box-shadow:0 2px 8px rgba(0,0,0,.08);', [
    h('div', { style: { fontSize: '11px', color: '#aaa', marginBottom: '9px', fontWeight: '700', textTransform: 'uppercase', letterSpacing: '0.6px' } }, 'Question ' + (q.cur+1)),
    h('div', { style: { fontSize: '18px', color: '#1a1a1a', lineHeight: '1.6', fontWeight: '500' } }, item.q)
  ]);
  c.appendChild(qc);

  var cl = div('display:grid;gap:9px;margin-bottom:14px;', []);
  item.choices.forEach(function(choice, i) {
    var st = 'normal';
    if (q.revealed) {
      if (i === corIdx) st = 'correct';
      else if (lastAns && 'ABCDE'.indexOf(lastAns.c) === i) st = 'wrong';
      else st = 'dim';
    }
    var bBg = st === 'correct' ? '#f0fff4' : st === 'wrong' ? '#fff5f5' : '#fff';
    var bBd = st === 'correct' ? '2px solid #4caf50' : st === 'wrong' ? '2px solid #f44336' : '2px solid #e8e8e8';
    var lBg = (st === 'correct' || st === 'wrong') ? (st === 'correct' ? '#4caf50' : '#f44336') : 'transparent';
    var lBd = st === 'correct' ? '2px solid #4caf50' : st === 'wrong' ? '2px solid #f44336' : '2px solid #ddd';
    var lCl = (st === 'correct' || st === 'wrong') ? '#fff' : '#888';
    var textColor = st === 'dim' ? '#bbb' : '#1a1a1a';

    var cb = h('button', {
      style: {
        display: 'flex', alignItems: 'center', gap: '13px', width: '100%',
        padding: '13px 15px', borderRadius: '12px',
        background: bBg, border: bBd, boxShadow: '0 1px 3px rgba(0,0,0,.06)',
        cursor: st === 'dim' ? 'default' : 'pointer', textAlign: 'left', fontFamily: 'inherit', fontSize: '15px', lineHeight: '1.4'
      },
      disabled: q.revealed && st === 'dim',
      onclick: function() {
        if (q.revealed) return;
        var ok = (i === corIdx);
        q.streak = ok ? q.streak + 1 : 0;
        q.answers[q.cur] = { c: 'ABCDE'[i], k: ok };
        q.revealed = true;
        var pp = gP(state.test, bn, sn);
        pp.a[q.cur] = { c: 'ABCDE'[i], k: ok };
        sP(state.test, bn, sn, pp);
        render();
      }
    }, [
      h('span', { style: { width: '28px', height: '28px', borderRadius: '50%', background: lBg, border: lBd, color: lCl, display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: '13px', fontWeight: '700', flexShrink: '0' } }, 'ABCDE'[i]),
      h('span', { style: { color: textColor } }, choice)
    ]);
    cl.appendChild(cb);
  });
  c.appendChild(cl);

  if (q.revealed && lastAns) {
    var ok = lastAns.k;
    var eb = div(
      'border-radius:12px;padding:15px;margin-bottom:14px;font-size:14px;line-height:1.7;' +
      'background:' + (ok ? '#f0fff4' : '#fff5f5') + ';' +
      'border:1.5px solid ' + (ok ? '#a7f3d0' : '#fca5a5') + ';' +
      'color:' + (ok ? '#064e3b' : '#7f1d1d') + ';',
      []
    );
    eb.appendChild(h('div', { style: { fontWeight: '700', marginBottom: '5px', fontSize: '15px' } },
      ok ? '\u2705 Correct!' : '\u274C Incorrect \u2014 the answer is ' + item.answer));
    eb.appendChild(document.createTextNode(item.why));
    c.appendChild(eb);

    c.appendChild(btn(
      'display:block;width:100%;padding:16px;border:none;border-radius:14px;background:#1a73e8;color:#fff;font-size:16px;font-weight:700;font-family:inherit;box-shadow:0 3px 10px rgba(26,115,232,.35);cursor:pointer;',
      q.cur < tot - 1 ? 'Next question \u2192' : 'See results \u2192',
      function() {
        var next = q.cur + 1;
        if (next >= q.items.length) {
          var sc2 = pct(Object.values(q.answers).filter(function(v) { return v.k; }).length, tot);
          var pp = gP(state.test, bn, sn);
          pp.tries = (pp.tries || 0) + 1;
          if (pp.best === null || sc2 > pp.best) pp.best = sc2;
          sP(state.test, bn, sn, pp);
          go('results');
        } else {
          q.cur = next; q.revealed = false; render();
        }
      }
    ));
  }
  return c;
}

// ── RESULTS ──────────────────────────────────────────────────────────────────
function renderResults() {
  var q = state.quiz;
  var tot = q.items.length;
  var cor = Object.values(q.answers).filter(function(v) { return v.k; }).length;
  var sc = pct(cor, tot);
  var gText, gColor;
  if (sc >= 90) { gText = 'Excellent!';      gColor = '#166534'; }
  else if (sc >= 75) { gText = 'Good job!';  gColor = '#15803d'; }
  else if (sc >= 60) { gText = 'Developing'; gColor = '#b45309'; }
  else { gText = 'Keep practicing!';         gColor = '#b91c1c'; }

  var bn = TD[state.test].batteries[state.bat].name;
  var sn = TD[state.test].batteries[state.bat].subtests[state.sub].name;
  var pp = gP(state.test, bn, sn);

  var c = div('', [screenHdr(function() { go('subtest'); }, sn)]);

  var rc = div('background:#fff;border-radius:16px;padding:26px 20px;margin-bottom:14px;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.08);', [
    h('div', { style: { fontSize: '60px', fontWeight: '800', lineHeight: '1' } }, sc + '%'),
    h('div', { style: { fontSize: '15px', color: '#888', marginTop: '6px' } }, cor + ' of ' + tot + ' correct'),
    h('div', { style: { fontSize: '20px', fontWeight: '700', marginTop: '8px', color: gColor } }, gText)
  ]);
  c.appendChild(rc);

  c.appendChild(div('display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:14px;', [
    statCard(cor, 'Correct', '#166534'),
    statCard(tot - cor, 'Incorrect', '#b91c1c'),
    statCard(pp.tries, 'Attempts')
  ]));

  var rbtns = div('display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px;', []);
  rbtns.appendChild(btn(
    'padding:15px;border:none;border-radius:14px;background:#1a73e8;color:#fff;font-size:15px;font-weight:700;font-family:inherit;cursor:pointer;',
    'Try again',
    function() {
      pp.a = {};
      sP(state.test, bn, sn, pp);
      state.quiz = { items: mkItems(state.test, state.bat, state.sub), cur: 0, answers: {}, streak: 0, revealed: false };
      go('quiz');
    }
  ));
  rbtns.appendChild(btn(
    'padding:15px;border:none;border-radius:14px;background:#f0f4f8;color:#1a1a1a;font-size:15px;font-weight:700;font-family:inherit;cursor:pointer;',
    state.showRev ? 'Hide review' : 'Review answers',
    function() { state.showRev = !state.showRev; render(); }
  ));
  c.appendChild(rbtns);

  c.appendChild(resetBtn('\u21ba Reset & shuffle this subtest', false, function() {
    if (!confirm('Clear answers for ' + sn + ' and shuffle the questions?')) return;
    sP(state.test, bn, sn, { a: {}, best: null, tries: 0 });
    state.quiz = { items: mkItems(state.test, state.bat, state.sub), cur: 0, answers: {}, streak: 0, revealed: false };
    go('quiz');
  }));

  if (state.showRev) {
    var wrong = q.items.map(function(item, i) { return { item: item, i: i, ans: q.answers[i] }; })
                       .filter(function(x) { return x.ans && !x.ans.k; });
    c.appendChild(h('div', { style: { fontSize: '11px', fontWeight: '700', color: '#aaa', textTransform: 'uppercase', letterSpacing: '0.6px', margin: '16px 0 10px' } }, 'Incorrect answers'));
    if (!wrong.length) {
      c.appendChild(h('div', { style: { padding: '16px', color: '#888', fontSize: '15px', textAlign: 'center' } }, 'Perfect score \u2014 nothing to review! \uD83C\uDF89'));
    } else {
      wrong.forEach(function(x) {
        var ci = 'ABCDE'.indexOf(x.item.answer);
        var wi = 'ABCDE'.indexOf(x.ans.c);
        var rv = div('background:#fff;border-radius:12px;padding:14px;margin-bottom:10px;box-shadow:0 1px 3px rgba(0,0,0,.07);', [
          h('div', { style: { fontSize: '14px', fontWeight: '600', marginBottom: '8px', color: '#1a1a1a' } }, x.item.q),
          h('div', { style: { fontSize: '13px', color: '#b91c1c', fontWeight: '600', marginBottom: '4px' } }, 'Your answer: ' + x.ans.c + '. ' + (x.item.choices[wi] || '?')),
          h('div', { style: { fontSize: '13px', color: '#166534', fontWeight: '600', marginBottom: '4px' } }, 'Correct: ' + x.item.answer + '. ' + x.item.choices[ci]),
          h('div', { style: { fontSize: '13px', color: '#666', lineHeight: '1.6', marginTop: '8px', paddingTop: '8px', borderTop: '1px solid #f0f0f0' } }, x.item.why)
        ]);
        c.appendChild(rv);
      });
    }
  }
  return c;
}

function render() {
  root.innerHTML = '';
  var screen;
  if      (state.screen === 'home')     screen = renderHome();
  else if (state.screen === 'battery')  screen = renderBattery();
  else if (state.screen === 'subtest')  screen = renderSubtest();
  else if (state.screen === 'quiz')     screen = renderQuiz();
  else if (state.screen === 'results')  screen = renderResults();
  if (screen) root.appendChild(screen);
}

loadP();
render();

    })();
  </script>
</body>
